name: Restore ECOMTECH Boot Manager v1.1.1

on:
  push:
    branches: [main]
    paths:
      - ".ecomtech_payload/main_parts/**"
      - ".github/workflows/restore-v111.yml"

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, 'Restore ECOMTECH Boot Manager v1.1.1')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source and generated assets
        shell: bash
        run: |
          set -euo pipefail

          cat .ecomtech_payload/main_parts/part*.b64 > /tmp/main.py.xz.b64
          base64 --decode /tmp/main.py.xz.b64 | xz -d > main.py

          expected="bbeac691156e41fba7da80092675eb3b195147b881c67fdafe290022ad4e0e86"
          actual="$(sha256sum main.py | cut -d' ' -f1)"
          test "$actual" = "$expected"

          python -m pip install --disable-pip-version-check "pillow>=10,<12"
          python make_icon.py

          rm -rf .ecomtech_payload .github/workflows/restore-v111.yml

      - name: Commit restored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore ECOMTECH Boot Manager v1.1.1"
          git push
