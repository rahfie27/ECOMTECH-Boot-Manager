name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.txt"
      - "**.toml"
      - "assets/**"
      - ".github/workflows/windows-build.yml"
      - "*.bat"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Syntax check
        run: python -m compileall main.py make_icon.py

      - name: Generate icon
        run: python make_icon.py

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECOMTECH-Windows-Boot-Manager
          path: dist/ECOMTECH_Windows_Boot_Manager.exe
          if-no-files-found: error
